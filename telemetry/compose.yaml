# Local-only Claude Code observability stack.
#
# Claude Code --OTLP--> otelcol --+--> prometheus  (metrics)
#                                 +--> loki        (events/logs)
#                                 +--> tempo       (traces, beta)
#                                          |
#                                       grafana
#
# Nothing is published beyond 127.0.0.1 and no service talks to the internet.

name: docschemy-telemetry

services:
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.159.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-4GB}
      - --web.enable-lifecycle
      # Would turn a scraped _created timestamp into a zero sample, so
      # increase() could count a series' first observation. The collector's
      # prometheus exporter is not currently emitting _created, so this is
      # inert today -- harmless, and correct the moment it does. Spend does
      # not depend on it: see ADR 0008.
      - --enable-feature=created-timestamp-zero-ingestion
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  loki:
    image: grafana/loki:3.7.6
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    user: "0:0"
    environment:
      LOKI_WAL_DISK_THRESHOLD: "${LOKI_WAL_DISK_THRESHOLD:-0.95}"
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:3.0.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    user: "0:0"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    environment:
      # Loopback-bound single-user stack: a login wall would only stand between
      # `make enable-telemetry` and a working dashboard.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: system
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
